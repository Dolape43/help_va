[package]
name = "helpva-desktop"
version = "0.1.0"
description = "HelpVA - interface de bureau (Tauri v2), moteur Python en sidecar"
authors = ["AXOSU"]
edition = "2021"

# Le gabarit officiel Tauri v2 met le code dans une bibliothèque (src/lib.rs)
# appelée par src/main.rs : c'est ce qui permet aussi de compiler pour mobile.
[lib]
name = "helpva_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Plugins officiels (mêmes versions majeures que les paquets npm @tauri-apps/plugin-*) :
tauri-plugin-shell = "2"   # lancer le moteur Python (sidecar) et lui parler par stdin/stdout
tauri-plugin-dialog = "2"  # fenêtres « Choisir un dossier / des fichiers »
tauri-plugin-opener = "2"  # ouvrir un lien dans le navigateur (support, site)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
