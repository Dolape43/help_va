<meta charset="utf-8">

<style>
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --surface-2:#FAFAFD; --line:#E7E8F1; --line-2:#EEEFF6;
  --ink:#16172B; --mut:#6B6E82; --faint:#9A9DB0;
  --acc:#5B4BFF; --acc-ink:#FFFFFF; --acc-weak:#ECEAFF;
  --ok:#0E8A4F; --ok-bg:#E4F5EC; --warn:#9A6A00; --warn-bg:#FaF0D8; --dng:#C33A3A; --dng-bg:#FBE9E9;
  --shadow:0 1px 2px rgba(16,17,40,.04), 0 8px 24px rgba(16,17,40,.06);
  --r:14px; --r-sm:10px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0E16; --surface:#161826; --surface-2:#1B1D2E; --line:#282A3C; --line-2:#222434;
  --ink:#ECEDF6; --mut:#9EA1B8; --faint:#6C6F86;
  --acc:#8072FF; --acc-ink:#0D0E16; --acc-weak:#211F3D;
  --ok:#4FD08A; --ok-bg:#123321; --warn:#E0B159; --warn-bg:#33280E; --dng:#F0868A; --dng-bg:#331616;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0D0E16; --surface:#161826; --surface-2:#1B1D2E; --line:#282A3C; --line-2:#222434;
  --ink:#ECEDF6; --mut:#9EA1B8; --faint:#6C6F86;
  --acc:#8072FF; --acc-ink:#0D0E16; --acc-weak:#211F3D;
  --ok:#4FD08A; --ok-bg:#123321; --warn:#E0B159; --warn-bg:#33280E; --dng:#F0868A; --dng-bg:#331616;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:28px 24px 16px;margin-bottom:8px;border-bottom:1px solid var(--line-2)}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow .logo{width:36px;height:36px;flex:none}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.link{background:none;border:none;color:var(--dng);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;padding:7px 10px;border-radius:8px}
.link:hover{background:var(--dng-bg)}
.tabs{display:flex;gap:2px;margin:16px 24px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{flex:1;border:none;background:none;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--mut);padding:9px 6px;border-radius:9px;cursor:pointer;transition:.15s}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
main{flex:1;padding:22px 24px 44px}
.panel[hidden]{display:none}
h1{font-size:19px;font-weight:600;margin:2px 0 2px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 18px}
label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin:14px 0 6px;letter-spacing:.01em}
input[type=text],input[type=number],input.f{width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;transition:.15s}
input.mono{font-family:var(--mono);letter-spacing:.02em}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-weak)}
input::placeholder{color:var(--faint)}
.btn{width:100%;font-family:var(--sans);font-size:14.5px;font-weight:600;border:none;border-radius:var(--r-sm);padding:13px;cursor:pointer;transition:.15s;margin-top:20px}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{color:var(--ink);border-color:var(--faint)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 20px}
.login .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 24px;max-width:400px;width:100%;margin:0 auto}
.login .logo{width:56px;height:56px;display:block;margin-bottom:14px}
.login .mark{font-weight:700;font-size:22px;letter-spacing:-.02em;margin-bottom:2px}
.login .mark em{color:var(--acc);font-style:normal}
.login .tagline{color:var(--mut);font-size:13px;margin-bottom:22px}
.login .btn{margin-top:16px}
.err{color:var(--dng);font-size:12.5px;margin-top:8px;min-height:0}
#mdp::placeholder{color:var(--faint);opacity:.6;letter-spacing:.14em}
.pwrap{position:relative}
.pwrap input{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--faint);cursor:pointer;padding:8px;display:grid;place-items:center;border-radius:8px}
.eye:hover{color:var(--mut)}
.eye:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.steps{display:flex;align-items:center;gap:8px;margin:2px 0 20px}
.step{display:flex;align-items:center;gap:8px;flex:1}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);color:var(--faint);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}
.step .nm{font-size:12px;color:var(--faint);font-weight:500;white-space:nowrap}
.step .bar{height:1.5px;background:var(--line);flex:1;border-radius:2px}
.step.on .dot{border-color:var(--acc);color:var(--acc);background:var(--acc-weak)}
.step.on .nm{color:var(--ink)}
.step.done .dot{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.step.done .nm{color:var(--ink)}
.choice{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;transition:.15s;font-family:var(--sans);width:100%}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-weak)}
.opt .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.opt[aria-pressed="true"] .tick{border-color:var(--acc);background:var(--acc)}
.opt[aria-pressed="true"] .tick::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc-ink)}
.opt .ttl{font-weight:600;font-size:14.5px}
.opt .ds{font-size:12.5px;color:var(--mut);margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px}
.seg button{border:none;background:none;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--mut);padding:9px 4px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-top:4px}
.result .done-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.result .done-h .r{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.result .done-h b{font-weight:600}
.codeblock{display:flex;flex-direction:column;gap:8px}
.codeline{font-family:var(--mono);font-size:14px;letter-spacing:.03em;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:11px 13px}
.licblock{font-family:var(--mono);font-size:12px;line-height:1.7;word-break:break-all;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:12px 13px;color:var(--mut)}
.search{margin-bottom:6px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 2px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:none}
.row .id{flex:1;min-width:0}
.row .nm{font-weight:500;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .meta{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mono{font-family:var(--mono);letter-spacing:.02em}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.01em;flex:none;text-transform:capitalize}
.pill.actif,.pill.libre{color:var(--ok);background:var(--ok-bg)}
.pill.suspendu{color:var(--warn);background:var(--warn-bg)}
.pill.resiliee,.pill.utilise{color:var(--dng);background:var(--dng-bg)}
.iact{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--mut);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;flex:none}
.iact:hover{color:var(--ink);border-color:var(--faint)}
.iact.dng:hover{color:var(--dng);border-color:var(--dng)}
.empty{color:var(--faint);font-size:13.5px;text-align:center;padding:26px 0}
.hactions{display:flex;align-items:center;gap:8px}
.themeBtn{background:none;border:1px solid var(--line);color:var(--mut);cursor:pointer;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;padding:0}
.themeBtn:hover{color:var(--ink);border-color:var(--faint)}
.row.clic{cursor:pointer;border-radius:8px;transition:background .12s}
.row.clic:hover{background:var(--surface-2)}
.copyhint{font-size:11px;color:var(--faint);flex:none}
.codeline.clic{cursor:pointer;transition:border-color .12s}
.codeline.clic:hover{border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<div class="shell">
  <!-- LOGIN -->
  <section class="login" id="login">
    <div class="card" style="position:relative">
      <button class="themeBtn" type="button" onclick="themeToggle()" aria-label="Changer de thème" style="position:absolute;top:16px;right:16px"></button>
      <img class="logo" alt="HelpVA">
      <div class="mark">Help<em>VA</em></div>
      <div class="tagline">Console de licences</div>
      <label for="mdp">Mot de passe</label>
      <div class="pwrap">
        <input class="f" type="password" id="mdp" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrer()">
        <button class="eye" type="button" id="eye" onclick="voir()" aria-label="Afficher le mot de passe"></button>
      </div>
      <div class="err" id="loginErr"></div>
      <button class="btn primary" id="btnLogin" onclick="entrer()">Se connecter</button>
    </div>
  </section>

  <!-- APP -->
  <div id="app" hidden style="display:flex;flex-direction:column;flex:1">
    <header class="top">
      <div class="brandrow"><img class="logo" alt=""><div class="brand"><b>HelpVA</b><span>Console de licences</span></div></div>
      <div class="hactions">
        <button class="themeBtn" type="button" onclick="themeToggle()" aria-label="Changer de thème"></button>
        <button class="link" onclick="sortir()">Déconnexion</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" onclick="onglet('creer',this)">Créer</button>
      <button class="tab" role="tab" aria-selected="false" onclick="onglet('licences',this)">Licences</button>
      <button class="tab" role="tab" aria-selected="false" onclick="onglet('codes',this)">Codes</button>
    </nav>

    <main>
      <!-- CREER -->
      <section class="panel" id="p-creer">
        <div class="steps">
          <div class="step on" id="s1"><div class="dot">1</div><div class="nm">Type</div><div class="bar"></div></div>
          <div class="step" id="s2"><div class="dot">2</div><div class="nm">Détails</div><div class="bar"></div></div>
          <div class="step" id="s3"><div class="dot">3</div><div class="nm">Résultat</div></div>
        </div>

        <div id="w1">
          <h1>Créer des codes d'activation</h1>
          <p class="sub">Le client saisit un code dans l'app, l'activation est automatique.</p>
          <div class="choice">
            <button class="opt" aria-pressed="true" onclick="choisir(this,'code')">
              <span class="tick"></span>
              <span><span class="ttl">Codes d'activation</span>
              <span class="ds">Génère un ou plusieurs codes à envoyer à tes clients.</span></span>
            </button>
          </div>
          <button class="btn primary" onclick="etape(2)">Continuer</button>
        </div>

        <div id="w2" hidden>
          <h1 id="w2t">Détails des codes</h1>
          <p class="sub" id="w2s">Configure puis génère.</p>

          <div id="f-code">
            <label>Quantité</label>
            <input class="f" type="number" id="cN" value="1" min="1" max="100">
            <label>Formule</label>
            <div class="seg" id="seg-code">
              <button aria-pressed="true">À vie</button><button aria-pressed="false">1 mois</button>
              <button aria-pressed="false">1 an</button><button aria-pressed="false">Essai</button>
            </div>
            <label>Nom du client <span style="color:var(--faint)">— optionnel</span></label>
            <input class="f" type="text" id="cNom" placeholder="Ex. Agence Erika">
          </div>

          <button class="btn primary" id="btnGen" onclick="generer()">Générer</button>
          <button class="btn ghost" onclick="etape(1)">Retour</button>
        </div>

        <div id="w3" hidden>
          <div class="result" id="r-code">
            <div class="done-h"><span class="r"></span><b id="r-code-h">Codes créés</b></div>
            <div class="codeblock" id="r-code-list"></div>
          </div>
          <button class="btn primary" onclick="copier()">Copier</button>
          <button class="btn ghost" onclick="etape(1)">Créer d'autres</button>
        </div>
      </section>

      <!-- LICENCES -->
      <section class="panel" id="p-licences" hidden>
        <h1>Licences</h1>
        <p class="sub" id="licSub">Chargement…</p>
        <input class="f search" type="text" id="licSearch" placeholder="Rechercher un client ou une empreinte" oninput="filtrer()">
        <div class="list" id="licList"></div>
      </section>

      <!-- CODES -->
      <section class="panel" id="p-codes" hidden>
        <h1>Codes</h1>
        <p class="sub" id="codeSub">Chargement…</p>
        <div class="list" id="codeList"></div>
      </section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// Logo : même image que l'icône de l'onglet (évite de la dupliquer dans la page).
document.querySelectorAll("img.logo").forEach(function(i){i.src=document.querySelector('link[rel="icon"]').href;});
const API="https://qjxhxhvdfcnikckakczk.supabase.co/functions/v1/admin";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqeGh4aHZkZmNuaWtja2FrY3prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMDQ5MjQsImV4cCI6MjEwNDY4MDkyNH0.pmrrbicOpnSoI09QnMJQ0eX_bQw4pB2pKwoT9uhTzeE";
let MDP="";
const $=id=>document.getElementById(id);

async function api(p){
  p.mdp=MDP;
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
    return await r.json();
  }catch(e){ return {erreur:"Pas de connexion au serveur"}; }
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800);}
function copyTxt(t){navigator.clipboard.writeText(t).then(()=>toast("Code copié"));}

/* thème clair / sombre */
const SUN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>';
function effTheme(){const a=document.documentElement.getAttribute("data-theme");if(a)return a;return matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
function majTheme(){const ic=effTheme()==="dark"?SUN:MOON;document.querySelectorAll(".themeBtn").forEach(b=>b.innerHTML=ic);}
function themeToggle(){const n=effTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("helpva_theme",n);}catch(e){}majTheme();}
try{const _t=localStorage.getItem("helpva_theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}
majTheme();

/* mot de passe */
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.4 5.2A9.6 9.6 0 0 1 12 5c7 0 10.5 7 10.5 7a17.2 17.2 0 0 1-3.1 3.9M6.1 6.1A17 17 0 0 0 1.5 12S5 19 12 19a9.5 9.5 0 0 0 3.3-.6"/></svg>';
$("eye").innerHTML=EYE;
function voir(){const i=$("mdp"),b=$("eye");const s=i.type==="password";i.type=s?"text":"password";b.innerHTML=s?EYE_OFF:EYE;b.setAttribute("aria-label",s?"Masquer le mot de passe":"Afficher le mot de passe");}
try{$("mdp").value=localStorage.getItem("helpva_mdp")||"";}catch(e){}

/* connexion */
async function entrer(){
  MDP=$("mdp").value.trim();
  $("loginErr").textContent="";
  if(!MDP){$("loginErr").textContent="Entre le mot de passe.";return;}
  $("btnLogin").disabled=true;$("btnLogin").textContent="Connexion…";
  const d=await api({action:"lister_codes"});
  $("btnLogin").disabled=false;$("btnLogin").textContent="Se connecter";
  if(d.ok){
    try{localStorage.setItem("helpva_mdp",MDP);}catch(e){}
    $("login").hidden=true;$("app").hidden=false;
    rendreCodes(d.codes||[]);chargerLic();
  }else{
    $("loginErr").textContent=d.erreur==="mauvais mot de passe"?"Mot de passe incorrect.":(d.erreur||"Connexion impossible.");
  }
}
function sortir(){$("app").hidden=true;$("login").hidden=false;}

/* onglets */
function onglet(id,el){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected","false"));
  el.setAttribute("aria-selected","true");
  document.querySelectorAll(".panel").forEach(p=>p.hidden=true);
  $("p-"+id).hidden=false;
  if(id==="licences")chargerLic();
  if(id==="codes")chargerCodes();
}

/* wizard */
let mode="code";
function choisir(el,m){mode=m;document.querySelectorAll(".opt").forEach(o=>o.setAttribute("aria-pressed","false"));el.setAttribute("aria-pressed","true");}
document.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");}));
function typeDe(segId){const b=document.querySelector("#"+segId+" button[aria-pressed='true']");const t=b?b.textContent.trim():"À vie";
  return {"À vie":"vie","1 mois":"mois","1 an":"an","Essai":"essai"}[t]||"vie";}
function typeLabel(t){return {vie:"À vie",mois:"1 mois",an:"1 an",essai:"Essai"}[t]||t;}
function etape(n){
  $("w1").hidden=n!==1;$("w2").hidden=n!==2;$("w3").hidden=n!==3;
  const S=[$("s1"),$("s2"),$("s3")];
  S.forEach((s,i)=>{s.classList.remove("on","done");if(i<n-1)s.classList.add("done");else if(i===n-1)s.classList.add("on");});
  if(n===2){
    $("f-code").hidden=false;
    $("w2t").textContent="Détails des codes";
    $("w2s").textContent="Configure la formule puis génère.";
  }
}

/* génération */
let dernier={mode:"code",codes:[],licence:""};
async function generer(){
  const btn=$("btnGen");btn.disabled=true;btn.textContent="Génération…";
  const d=await api({action:"creer_codes",n:$("cN").value,type:typeDe("seg-code"),nom:$("cNom").value});
  btn.disabled=false;btn.textContent="Générer";
  if(!d.ok){toast(d.erreur||"Erreur");return;}
  dernier={mode:"code",codes:d.codes};
  $("r-code").hidden=false;
  $("r-code-h").textContent=d.codes.length+(d.codes.length>1?" codes créés":" code créé");
  $("r-code-list").innerHTML=d.codes.map(c=>'<div class="codeline clic" onclick="copyTxt(\''+c+'\')" title="Cliquer pour copier">'+c+'</div>').join("");
  etape(3);
}
function copier(){
  const txt=dernier.mode==="code"?dernier.codes.join("\n"):dernier.licence;
  navigator.clipboard.writeText(txt).then(()=>toast("Copié"));
}

/* listes licences */
let _lics=[];
async function chargerLic(){
  $("licSub").textContent="Chargement…";$("licList").innerHTML="";
  const d=await api({action:"lister"});
  if(!d.ok){$("licSub").textContent=d.erreur||"Erreur";return;}
  _lics=d.licences||[];filtrer();
}
function filtrer(){
  const q=($("licSearch").value||"").toLowerCase();
  const L=_lics.filter(l=>!q||(l.nom_client||"").toLowerCase().includes(q)||(l.empreinte||"").toLowerCase().includes(q));
  const act=_lics.filter(x=>x.statut==="actif").length;
  $("licSub").textContent=_lics.length+" licence"+(_lics.length>1?"s":"")+" · "+act+" active"+(act>1?"s":"");
  $("licList").innerHTML=L.length?L.map(ligneLic).join(""):'<div class="empty">Aucune licence.</div>';
}
function ligneLic(l){
  const exp=l.exp?("exp. "+l.exp):"à vie";
  const label=l.statut==="resiliee"?"résiliée":l.statut;
  let a="";
  if(l.statut==="actif")a='<button class="iact" onclick="setStatut(\''+l.id+'\',\'suspendu\')">Suspendre</button><button class="iact dng" onclick="setStatut(\''+l.id+'\',\'resiliee\')">Résilier</button>';
  else if(l.statut==="suspendu")a='<button class="iact" onclick="setStatut(\''+l.id+'\',\'actif\')">Activer</button><button class="iact dng" onclick="setStatut(\''+l.id+'\',\'resiliee\')">Résilier</button>';
  else a='<button class="iact" onclick="setStatut(\''+l.id+'\',\'actif\')">Activer</button>';
  return '<div class="row"><div class="id"><div class="nm">'+(l.nom_client||"—")+' <span class="pill '+l.statut+'">'+label+'</span></div>'
    +'<div class="meta mono">'+l.empreinte+' · '+typeLabel(l.type)+' · '+exp+'</div></div>'+a+'</div>';
}
async function setStatut(id,statut){
  if(statut==="resiliee"&&!confirm("Résilier cette licence ? Le client sera bloqué à sa prochaine connexion."))return;
  const d=await api({action:"statut",id,statut});
  if(d.ok){toast("Mis à jour");chargerLic();}else toast(d.erreur||"Erreur");
}

/* listes codes */
async function chargerCodes(){
  $("codeSub").textContent="Chargement…";$("codeList").innerHTML="";
  const d=await api({action:"lister_codes"});
  if(!d.ok){$("codeSub").textContent=d.erreur||"Erreur";return;}
  rendreCodes(d.codes||[]);
}
function rendreCodes(C){
  const libres=C.filter(x=>x.statut==="libre").length;
  $("codeSub").textContent=C.length+" code"+(C.length>1?"s":"")+" · "+libres+" libre"+(libres>1?"s":"");
  $("codeList").innerHTML=C.length?C.map(ligneCode).join(""):'<div class="empty">Aucun code. Crée-en dans l\'onglet Créer.</div>';
}
function ligneCode(c){
  const label=c.statut==="utilise"?"utilisé":c.statut;
  const meta=[typeLabel(c.type),c.nom_client,c.empreinte].filter(Boolean).join(" · ");
  return '<div class="row clic" onclick="copyTxt(\''+c.code+'\')" title="Cliquer pour copier"><div class="id"><div class="nm mono">'+c.code+' <span class="pill '+c.statut+'">'+label+'</span></div>'
    +'<div class="meta">'+meta+'</div></div><span class="copyhint">copier</span></div>';
}
</script>
